<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch Command Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --surface-2: #ffffff;
    --border: #e4e3df;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #7c7b76;
    --accent: #2a78d6;
    --good: #008300;
    --serious: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --surface-2: #242423;
      --border: #3a3a38;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #8f8e86;
      --accent: #3987e5;
      --good: #4caf50;
      --serious: #e66767;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface-1);
    color: var(--text-primary);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 20px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; }
  .health { font-size: 13px; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 6px; }
  .health .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
  .health.up .dot { background: var(--good); }
  .health.down .dot { background: var(--serious); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .tile { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .tile .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }
  .tile .value { font-size: 28px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile .value.small { font-size: 16px; font-weight: 500; }

  form { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 24px; }
  .field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 200px; }
  label { font-size: 12px; color: var(--text-secondary); }
  input {
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font: inherit;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 9px 18px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .msg { flex-basis: 100%; font-size: 13px; min-height: 1.2em; margin: 0; }
  .msg.ok { color: var(--good); }
  .msg.err { color: var(--serious); }

  h2 { font-size: 15px; margin: 0 0 8px; color: var(--text-secondary); font-weight: 600; }
  .table-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 9px 14px; border-top: 1px solid var(--border); white-space: nowrap; }
  td:first-child { white-space: normal; min-width: 200px; }
  thead th { border-top: none; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); font-weight: 600; }
  td.time { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .empty { padding: 24px 14px; color: var(--text-muted); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Dispatch Command Dashboard</h1>
    <span class="health" id="health"><span class="dot"></span><span id="health-text">checking…</span></span>
  </header>

  <div class="tiles">
    <div class="tile">
      <div class="label">Queued dispatches</div>
      <div class="value" id="stat-count">–</div>
    </div>
    <div class="tile">
      <div class="label">Projects</div>
      <div class="value" id="stat-projects">–</div>
    </div>
    <div class="tile">
      <div class="label">Last dispatch</div>
      <div class="value small" id="stat-last">–</div>
    </div>
  </div>

  <form id="dispatch-form">
    <div class="field">
      <label for="task">Task</label>
      <input id="task" name="task" required placeholder="e.g. refactor auth module">
    </div>
    <div class="field">
      <label for="project">Project</label>
      <input id="project" name="project" required placeholder="e.g. airllm">
    </div>
    <button type="submit" id="submit-btn">Dispatch</button>
    <p class="msg" id="form-msg"></p>
  </form>

  <h2>Dispatch queue</h2>
  <div class="table-scroll">
    <table>
      <thead><tr><th>Task</th><th>Project</th><th>Received</th></tr></thead>
      <tbody id="queue-body"><tr><td colspan="3" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  function fmtTime(iso) {
    const d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleString();
  }

  async function refreshQueue() {
    try {
      const res = await fetch('/queue');
      const data = await res.json();
      const entries = data.entries || [];
      $('stat-count').textContent = entries.length;
      $('stat-projects').textContent = new Set(entries.map((e) => e.project)).size;
      $('stat-last').textContent = entries.length ? fmtTime(entries[entries.length - 1].receivedAt) : 'none yet';

      const body = $('queue-body');
      if (!entries.length) {
        body.innerHTML = '<tr><td colspan="3" class="empty">No dispatches yet — submit one above.</td></tr>';
        return;
      }
      body.innerHTML = entries
        .slice()
        .reverse()
        .map((e) => `<tr><td>${esc(e.task)}</td><td>${esc(e.project)}</td><td class="time">${esc(fmtTime(e.receivedAt))}</td></tr>`)
        .join('');
    } catch {
      $('queue-body').innerHTML = '<tr><td colspan="3" class="empty">Could not load queue.</td></tr>';
    }
  }

  async function refreshHealth() {
    const el = $('health');
    try {
      const res = await fetch('/health');
      const ok = res.ok;
      el.className = 'health ' + (ok ? 'up' : 'down');
      $('health-text').textContent = ok ? 'server online' : 'server error';
    } catch {
      el.className = 'health down';
      $('health-text').textContent = 'server unreachable';
    }
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  $('dispatch-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const msg = $('form-msg');
    const btn = $('submit-btn');
    btn.disabled = true;
    msg.className = 'msg';
    msg.textContent = '';
    try {
      const res = await fetch('/dispatch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ task: $('task').value.trim(), project: $('project').value.trim() }),
      });
      const data = await res.json();
      if (res.ok) {
        msg.className = 'msg ok';
        msg.textContent = 'Dispatched.';
        $('task').value = '';
        refreshQueue();
      } else {
        msg.className = 'msg err';
        msg.textContent = data.message || 'Dispatch failed.';
      }
    } catch {
      msg.className = 'msg err';
      msg.textContent = 'Could not reach server.';
    } finally {
      btn.disabled = false;
    }
  });

  refreshQueue();
  refreshHealth();
  setInterval(refreshQueue, 5000);
  setInterval(refreshHealth, 10000);
</script>
</body>
</html>
