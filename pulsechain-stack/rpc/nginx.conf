worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # Docker's embedded DNS — with variable proxy_pass, nginx re-resolves the
    # execution container if it is recreated with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Per-IP rate limiting. Tune for your audience: 20 req/s with burst 40
    # is comfortable for wallets/dapps, hostile to scrapers.
    limit_req_zone $binary_remote_addr zone=rpc:20m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=rpc_conn:20m;

    log_format rpc '$remote_addr [$time_local] "$request" $status '
                   '$body_bytes_sent $request_time';
    access_log /dev/stdout rpc;
    error_log /dev/stderr warn;

    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;
        client_body_timeout 15s;

        # Lightweight liveness endpoint for load balancers / uptime checks
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # JSON-RPC over HTTP
        location / {
            limit_req zone=rpc burst=40 nodelay;
            limit_conn rpc_conn 20;

            set $upstream_http http://execution:8545;
            proxy_pass $upstream_http;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # JSON-RPC over WebSocket
        location /ws {
            limit_req zone=rpc burst=40 nodelay;
            limit_conn rpc_conn 20;

            set $upstream_ws http://execution:8546;
            rewrite ^/ws$ / break;
            proxy_pass $upstream_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # ------------------------------------------------------------------------
    # TLS server — uncomment after placing certs in rpc/certs/ and enabling
    # the 443 port mapping + certs volume in docker-compose.yml.
    # See rpc/README.md for a certbot walkthrough.
    # ------------------------------------------------------------------------
    # server {
    #     listen 443 ssl;
    #     server_name rpc.example.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #
    #     client_max_body_size 10m;
    #
    #     location = /health {
    #         access_log off;
    #         default_type application/json;
    #         return 200 '{"status":"ok"}';
    #     }
    #     location / {
    #         limit_req zone=rpc burst=40 nodelay;
    #         limit_conn rpc_conn 20;
    #         set $upstream_http http://execution:8545;
    #         proxy_pass $upstream_http;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_read_timeout 60s;
    #     }
    #     location /ws {
    #         limit_req zone=rpc burst=40 nodelay;
    #         limit_conn rpc_conn 20;
    #         set $upstream_ws http://execution:8546;
    #         rewrite ^/ws$ / break;
